# s6-reprojection-b (round 5, Astra's P2 on round 4): the hints that name a "kind" for the 3D and Reprojection modes alone
# are in the reprojection module's own hints (project/TK-Unity/Assets/TK/Modular/Modules/reprojection/hints/hints.toml),
# read only while it draws: Normal's Sun Shadows read "kind" too (SunShadow.ByKind), and these classifications are the
# modes' drawing, not the art's, so Normal keeps its own rule there. The gates' middles, the mounds, the thatched roofs, the
# pictures on inside walls, Dirge's dither and the clouds moved there.

# Rocks and furniture drawn as thin solids (s6-reprojection-b, the design's cases C and J): from the side they were
# paper-thin, and a deeper solid (depth = 1) carries the picture's dark outline round its sides, so they stood as black
# boxes. As turning cards (round 10's trees' way) each shows its whole picture from every side. The grey boulders (559-562:
