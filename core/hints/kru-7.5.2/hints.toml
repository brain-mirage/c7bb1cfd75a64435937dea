# The shipped base hints for the base pack set (kru-7.5.2): what the world renderers' rules get wrong about its
# pictures, on every map (docs/user-related/research/3dsen-and-tile-hints.md). The rules stay the defaults: an entry
# replaces only the fields it names, and a map's own file (maps/<number>.toml) or the player's files can override it.
# Read by the host (TK.Modular.Draw.WorldHints) from local files only: nothing here is sent to any server.

