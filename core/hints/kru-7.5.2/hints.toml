# s6-reprojection (round 48; docs/user-related/decisions/2026-10-08-material-map.md): the starter materials. A material map
# (an entry's materials = "<png>": red a material's index, alpha its strength, green a direction) marks an artwork's
# pixels with them, and a ground's surface may name one for its whole tile. A property a material leaves unset keeps the
# automatic rule. s6-effects (round 44) draws the looks: gloss catches the sky's light, glow keeps a pixel's colour at
# night (flicker: Real Lights' names), murk makes water reflect less. A map's own file or the player's may retune any of
# them, field by field. Drawing only: nothing here is sent to any server.

[material.water]          # drawn as water, its waves and reflections; surface = "water" names it
index = 1
water = true

[material.flowing-water]  # its way from the map's green, else the tile's surface_flow, else a flow given here
based_on = "water"
index = 2
speed = 0.5

[material.rapid-water]
based_on = "flowing-water"
index = 3
speed = 2

[material.murky-water]
based_on = "water"
index = 4
murk = 0.6

[material.sand]           # walking leaves prints in it without snow
index = 5
water = false
footprints = true

[material.wood]
index = 6
water = false

[material.glossy]
index = 7
gloss = 0.8

[material.magma]
index = 8
water = false
snow = false
puddles = false
glow = 0.8
flicker = "fire"

[material.fire]
index = 9
water = false
snow = false
puddles = false
glow = 1
flicker = "fire"

[material.glass]          # an object's tinted glass: what stands behind it shows through
index = 10
opacity = 0.35
tint = "#a8d8ff"

[material.flat-colour]    # its pixels in their mean colour: undoes painted light without picking a colour
index = 11
flat = "average"

# s6-effects (round 47; the owner's request docs/user-related/requests/2026-10-09-ice-tint-and-outer-area-snow.md: "in 2d
# mode the ice effect should have a slightly blue tint its hard to tell the trasnition when there is heavy snowo cover"):
# the snow lying on ice is laid thinner, so the ice's blue shows through it in every mode and its edge stays visible under a
# heavy cover. snow_opacity: how solid the snow on its pixels is drawn (1, any ground's, when unset).
[material.ice]
index = 12
snow_opacity = 0.5

# The ice tiles (Arctic Village's frozen river and sea, every map they are used on): the plain ice, and the ice meeting the
# snow (its snowy pixels stay white under the snow).
[tile.832-858]
surface = "ice"

[tile.864-876]
surface = "ice"
