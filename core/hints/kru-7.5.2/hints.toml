# cliff's face in their top 42 rows and the grass at its foot in the bottom 6. The face now stands, the grass lies before it, and
# the rule's block of the whole cell goes. The pieces above them (17944-17945, 17864-17865) paint the face's upper part
# and stay the rule's blocks; the curved end pieces (17950, 17955, 17873) are shapes for the design's footprints (its 6).

