# The shapes (round 12, the design's 6.3-6.4): an outline in the ground plan, raised or sunk to a height, the picture laid
# on by the game's own drawing rule. The numbers are read from the pictures, fitted by eye.

[sobj.437-438]        # the well's two halves (in Buya at 59-60, 108 and 52-53, 135): a stone ring round a hole
group = "well"

[group.well]           # measured from the picture (round 13; round 12 had the design's estimates, which put the rim above it)
footprint = "ring"
radius = 0.86          # the outer wall: 83 pixels across
inner = 0.6            # the hole: 57 pixels across
height = 0.5           # the rim: its front wall is painted 22 pixels high
floor = -1.0           # the hole's bottom, below the ground (the ground is cut there)
offset = [0.0, -0.375] # the ring's centre lies three eighths of a cell north of the middle of the pieces' cells
oval = 0.7             # its rim is painted 0.7 as deep as it is wide: the oval stretched onto the true circle

[sobj.472-479]        # the round thatched huts' roof pieces: one round roof. Six pieces (472-474, 477-479; in Buya at 108-113
group = "round-hut"   # and 116-121 on row 134) or eight (472-479; at 31-38, 105 and 79-86, 131). A longer run, its middle
                      # pieces repeated, is a long thatched house (Country Farm's, Kugnae's, Buya's at 40-48, 105): the
                      # renderer gives it no circle and a ridge along the run (round 16)

[group.round-hut]
footprint = "circle"
radius = 2.6          # the six-piece huts': wider than the walls, so the eaves overhang
roof = "cone"
height = 3
offset = [0.0, -1.0]  # the roof lies at its height over the rows its picture is drawn on, a cell north of its pieces' middle

[sobj.476]            # the eight-piece huts' middle piece, which their joined roof takes its fields from (its anchor): wider
radius = 3.4

[sobj.876-889]        # the flowering hedges (two sets of pieces: 876-882 and 883-889, an end, middles and an end; in Buya
group = "hedge"       # south of the round huts): the rules joined each into one tree, a card showing its flat front from
                      # every side. Traced (round 13): its front follows its stems' foot line, a straight back a cell behind,
[group.hedge]         # and it stands two cells high, its foliage on its front and top as the picture paints them
footprint = "traced"
back = 1
height = 2

