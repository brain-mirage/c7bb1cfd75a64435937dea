# Cat's Delight (map 50) on the test server: indoors (s6-effects round 2, from the test server's own MapIndoor flag): no
# sky, so no clouds, wind or lightning, and its plants stand still. Applies only when the map the server sends passes the
# check (3.5).

[check]
size = "30x20"

[map]
indoor = true
outdoor = 0 # Kugnae, through its doors (the test server's warps)
dark = true # painted dark (docs/user-related/research/2026-10-27-dark-maps.tsv): our lighting adds no light
