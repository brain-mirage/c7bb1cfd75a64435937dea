# Isolde's Office (map 4027) on the test server: indoors (s6-reprojection-cloud-3 run 57, after the owner's note on
# Weaver of Dreams, map 4023): a staff office: a walled room with windows, a grey floor, a carpet and furniture. The
# test server's MapIndoor flag says 0 here, as for the rest of the staff maps 4015-4035, so the flag is set by
# looking. No sky, so no rain, clouds, wind, lightning or cloud ring past its edges. Applies only when the map the
# server sends passes the check (3.5).

[check]
size = "20x20"

[map]
indoor = true
