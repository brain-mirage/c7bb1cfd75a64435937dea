# SourceMap 3811 Arctic: the native three-layer SOBJ1156-1187 faces stand two cells high.
# Global tile-neighbor hints handle the snow next to those faces; this map-only override reaches the interiors
# of their connected blocked-snow banks. It applies to 633 source cells before bank/model/coverage exclusions.
# Eight zero-height entries retain unrelated snow and the pavilion's hidden-ice context at ground level.
# The 89 flat level-two cells keep whole bank-connected trees, crystals, snow piles and the enclosed fence together.
# Our 3D inverse uses drawn height to name the cell under the pointer, matching 4a MapPane 0x00507150's flat-map rule.
# Changing drawn height can change that cell/command; native map words and packet encoding stay unchanged.

