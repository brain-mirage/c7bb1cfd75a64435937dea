# cloud-3 run 58: the shrine on its ice platform (the arctic-shrine virtual object in hints.toml). Its floor between its
# ice walls is paving 1429, which also lies at ground level at the stairs' foot (44-47, 39), so no tile hint can raise it:
# raised here to the platform's level, the hut's doorway (380-381, its own items) stands on the platform with the hut.
# Drawing only: the 3D pointer picks on the ground plane (engine/View.cs, reprojection's Inverse.MapPoint), not on this
# raised floor; a raised floor can only move the following camera's height. Native map words and packets are unchanged.
[cells."45,36-46,36"]
ground = "flat"
level = 2

# The shrine's stairs (tile 334, two rows) climb from the ground at their foot (44-47, 39) to the hut's floor: two
# slopes rising north, 1 to 0 and 2 to 1 (each slope's high edge at its level, its low edge at the cell beyond). Flat,
# they lay in a slot and met the raised floor's ice face. Drawing only, as above.
[cells."45,37-46,37"]
ground = "slope"
rises = "n"
level = 2

