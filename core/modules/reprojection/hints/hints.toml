# The reprojection module's own tile hints (s6-reprojection-b, round 5; the design's 3.4 and 3.6, the chosen world
# renderer's hints: docs/user-related/research/3dsen-and-tile-hints.md). Read by the host (TK.Modular.Draw.WorldHints) only
# while this module is the chosen world renderer, after the shipped base hints and before a pack's and the player's, from
# local files: nothing here is sent to any server.
#
# Why these are here and not in the base hints: each names a "kind" that is how the 3D, Flat and Sphere modes should build
# the piece, where Normal's Sun Shadows (s6-effects-c, SunShadow.ByKind) read the same field to decide what casts. In the
# base hints they changed Normal (Astra's P2 on round 4: the clouds 7766-7774 stopped casting). Here Normal keeps its own
# rule. Every entry below was in the base hints before round 5, unchanged but for this note and the clouds' map count.

# Bookshelf artwork: keep the original books on the front and use native plain wood for invented sides,
# back and exposed top. These are artwork definitions, shared by every placement; Dharma is one example.
# Wall is their pictured shape even on unblocked cells (Eternal Order); it does not change map pass flags.
# 729 is a plain panel and 734 a framed display, so neither is part of this bookshelf family.
[sobj.730-733]
kind = "wall"
skin = "tile/14393"

[sobj.735-738]
kind = "wall"
skin = "tile/14393"

